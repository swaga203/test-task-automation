ServerName localhost


PassEnv DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD UPLOAD_FOLDER

<VirtualHost *:80>
    ServerName localhost

    
    WSGIDaemonProcess web_service user=www-data group=www-data threads=5
    WSGIProcessGroup web_service
    
    
    WSGIApplicationGroup %{GLOBAL}
    
    WSGIScriptAlias / /app/app.wsgi

    <Directory /app>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    
    Alias /media /app/uploads
    <Directory /app/uploads>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>