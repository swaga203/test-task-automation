services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - uploads:/app/uploads
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: videos
      DB_USER: video_user
      DB_PASSWORD: video_pass
      UPLOAD_FOLDER: /app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: videos
      POSTGRES_USER: video_user
      POSTGRES_PASSWORD: video_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_user -d videos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads: